<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Friday Countdown</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon (optional) -->
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
</head>
<body>

  <!-- Countdown Banner -->
  <div id="countdown-banner" class="countdown-banner">
    <button id="close-banner" class="close-banner">&times;</button>
    <p class="banner-text">Time until Black Friday Sale</p>
    <div id="countdown" class="countdown">
      <div class="time-segment"><span id="hours">00</span><small>Hrs</small></div>
      <div class="colon">:</div>
      <div class="time-segment"><span id="minutes">00</span><small>Min</small></div>
      <div class="colon">:</div>
      <div class="time-segment"><span id="seconds">00</span><small>Sec</small></div>
    </div>
  </div>

  <!-- Page Content -->
  <main>
    <h1>Welcome to Typhoon Texas</h1>
    <p>Get ready for the best Black Friday deals!</p>
  </main>

  <!-- External JavaScript -->
  <script src="script.js"></script>
</body>
</html>
