<script>
(function() {
  if (window._paydiaGA4Registered) return;
  window._paydiaGA4Registered = true;

   window.dataLayer = window.dataLayer || [];
  var _currency = 'USD';
  var _lastCart = null;
  var _cartOpenPending = false;  // flag set by cartOpened, consumed by cartUpdate

  // Keyed by item id — populated from paydia.storeUpdate catalog.
  // Used to enrich cart items that only carry id/qty/price (no name).
  var _storeItemMap = {};

  // Replaced by dynamic build in storeUpdate — no longer hardcoded.
  // Kept as an override map if you need to correct a category name.
  var _categoryOverrides = {
    // 1: 'Season Passes'  // uncomment to override a specific id
  };

  function resolveCategory(item) {
    var catId = item.category_id;
    if (catId && _categoryOverrides[catId]) { return _categoryOverrides[catId]; }
    // Fall back to dynamically cached name from storeUpdate
    if (catId && _storeItemMap['cat_' + catId]) { return _storeItemMap['cat_' + catId]; }
    if (catId) { return 'category_' + catId; }
    return '';
  }
  // ---------------------------------------------------------------------------
  // GA4 push helper
  // ---------------------------------------------------------------------------
  function pushGA4(eventName, ecommerceData) {
    dataLayer.push({ ecommerce: null });
    dataLayer.push({ event: eventName, ecommerce: ecommerceData });
  }

  // ---------------------------------------------------------------------------
  // Meta Pixel push helper
  // Guards against fbq not being defined (pixel blocked, slow load, etc.)
  // ---------------------------------------------------------------------------
  function pushPixel(eventName, params) {
    if (typeof fbq === 'function') {
      fbq('track', eventName, params);
    }
  }

  // ---------------------------------------------------------------------------
  // Transaction ID strategy
  //
  // The Paydia payload does NOT include a native order ID.
  // Strategy: hashed_email prefix + total_amount_paid + concatenated pos_item IDs.
  // Deterministic — if the same event fires twice (redirect/double-fire),
  // GA4 deduplicates correctly.
  //
  // KNOWN RISK: same customer, same items, same total on two separate orders
  // will produce a collision. Fix: request order_id from Paydia and use it here.
  // ---------------------------------------------------------------------------
  function buildTransactionId(d) {
    var emailPart = (d.hashed_email && d.hashed_email.length >= 16)
      ? d.hashed_email.substring(0, 16)
      : 'anon';
    var total = d.total_amount_paid || d.total || 0;
    var itemIds = '';
    var items = d.items || [];
    for (var i = 0; i < items.length; i++) {
      var posItem = items[i].pos_item || {};
      itemIds += (posItem.id || items[i].id || 'x');
      if (i < items.length - 1) { itemIds += '-'; }
    }
    return emailPart + '_' + total + '_' + itemIds;
  }

  // ---------------------------------------------------------------------------
  // Map a single Paydia item → GA4 item object
  // ---------------------------------------------------------------------------
  function mapItem(item) {
    var posItem = item.pos_item || {};
    var itemId = posItem.id ? String(posItem.id) : String(item.id || '');
    var itemName = item.item_name || posItem.long_name || posItem.short_name || '';
    var priceCents = item.price || posItem.price_cents || 0;
    return {
      item_id:       itemId,
      item_name:     itemName,
      item_category: resolveCategory(item),
      price:         priceCents / 100,
      quantity:      item.qty || 1
    };
  }

  // ---------------------------------------------------------------------------
  // Deduplicate items by item_id, summing quantities.
  // GA4 requires unique item_id per items array.
  // Paydia sends one entry per seat even when the same product is purchased
  // multiple times — this collapses them into one entry with the correct qty.
  // ---------------------------------------------------------------------------
  function deduplicateItems(mappedItems) {
    var indexMap = {};
    var result = [];
    for (var i = 0; i < mappedItems.length; i++) {
      var item = mappedItems[i];
      var key = item.item_id;
      if (indexMap[key] !== undefined) {
        result[indexMap[key]].quantity += item.quantity;
      } else {
        indexMap[key] = result.length;
        result.push({
          item_id:       item.item_id,
          item_name:     item.item_name,
          item_category: item.item_category,
          price:         item.price,
          quantity:      item.quantity
        });
      }
    }
    return result;
  }

  // ---------------------------------------------------------------------------
  // paydia.storeUpdate — cache currency + build item/category lookup maps
  //
  // Payload shape: e.detail.store.settings  (NOT e.detail.settings)
  // Builds _storeItemMap keyed by item id for name/price lookups used by
  // view_cart and begin_checkout, where cart items only carry id/qty/price.
  // Also caches category names under 'cat_<id>' keys.
  // ---------------------------------------------------------------------------
  window.addEventListener('paydia.storeUpdate', function(e) {
    var d = e.detail || {};
    var store = d.store || {};
    var settings = store.settings || {};

    // Fix: was d.settings — correct path is d.store.settings
    if (settings.currency_code) {
      _currency = settings.currency_code;
    }

    // Seed _lastCart from storeUpdate on page load.
    // paydia.cartUpdate only fires on cart changes — not on initial load.
    // This ensures view_cart works even if the user opens the cart without
    // adding or removing anything first.
    var initialCart = d.cart || {};
    if (initialCart.items && initialCart.items.length > 0 && !_lastCart) {
      _lastCart = initialCart;
    }

    // Build item and category lookup maps from the full store catalog
    var categories = store.categories || [];
    for (var i = 0; i < categories.length; i++) {
      var cat = categories[i];
      // Cache category name keyed by id
      if (cat.id) {
        _storeItemMap['cat_' + cat.id] = cat.name || '';
      }
      var catItems = cat.items || [];
      for (var j = 0; j < catItems.length; j++) {
        var si = catItems[j];
        if (si.id) {
          _storeItemMap[si.id] = {
            name:          si.name || '',
            price:         si.price || 0,
            category_name: cat.name || '',
            category_id:   cat.id || null
          };
        }
      }
    }
  });


  // ---------------------------------------------------------------------------
  // paydia.cartUpdate — cache last cart state for view_cart / checkoutStarted
  // ---------------------------------------------------------------------------
  window.addEventListener('paydia.cartUpdate', function(e) {
    _lastCart = e.detail || null;

    // If the cart was opened before this update arrived, fire view_cart now
    // using the freshest cart data. Resets the flag so it only fires once.
    if (_cartOpenPending) {
      _cartOpenPending = false;
      pushViewCart(_lastCart);
    }
  });

  // ---------------------------------------------------------------------------
  // add_to_cart → GA4 + Meta AddToCart
  // ---------------------------------------------------------------------------
  window.addEventListener('paydia.addToCart', function(e) {
    var d = e.detail || {};
    var item = d.item || {};
    var category = d.category || {};
    var posItem = item.pos_item || {};
    var priceCents = item.price || posItem.price_cents || 0;
    var qty = d.newQty || 1;
    var itemId = posItem.id ? String(posItem.id) : String(item.id || '');
    var itemName = item.item_name || item.name || posItem.long_name || posItem.short_name || '';
    var value = (priceCents / 100) * qty;

    // GA4
    pushGA4('add_to_cart', {
      currency: _currency,
      value:    value,
      items: [{
        item_id:       itemId,
        item_name:     itemName,
        item_category: category.name || resolveCategory(item),
        price:         priceCents / 100,
        quantity:      qty
      }]
    });

    // Meta Pixel
    pushPixel('AddToCart', {
      value:        value,
      currency:     _currency,
      content_ids:  [itemId],
      content_name: itemName,
      content_type: 'product'
    });
  });

  // ---------------------------------------------------------------------------
  // remove_from_cart → GA4 only (no Meta Pixel standard event for this)
  // ---------------------------------------------------------------------------
  window.addEventListener('paydia.removeFromCart', function(e) {
    var d = e.detail || {};

    if (d.item) {
      var item = d.item;
      var posItem = item.pos_item || {};
      var priceCents = item.price || posItem.price_cents || 0;
      var itemId = posItem.id ? String(posItem.id) : String(item.id || '');
      var removedQty = (d.previousQty != null && d.newQty != null)
        ? d.previousQty - d.newQty
        : 1;
      if (removedQty < 1) { removedQty = 1; }

      pushGA4('remove_from_cart', {
        currency: _currency,
        value:    (priceCents / 100) * removedQty,
        items: [{
          item_id:       itemId,
          item_name:     item.item_name || item.name || posItem.long_name || posItem.short_name || '',
          item_category: (d.category && d.category.name) || resolveCategory(item),
          price:         priceCents / 100,
          quantity:      removedQty
        }]
      });

    } else {
      // Shape 2: cart frontend — no item object, look up name/price from _storeItemMap
      var cartItemId = String(d.id || '');
      var cartLookup = _storeItemMap[d.id] || {};
      var cartQty = d.qty || 1;
      pushGA4('remove_from_cart', {
        currency: _currency,
        value:    ((cartLookup.price || 0) / 100) * cartQty,
        items: [{
          item_id:       cartItemId,
          item_name:     d.name || d.item_name || cartLookup.name || '',
          item_category: cartLookup.category_name || resolveCategory(d),
          price:         (cartLookup.price || 0) / 100,
          quantity:      cartQty
        }]
      });
    }
  });

   // ---------------------------------------------------------------------------
  // pushViewCart — shared logic for view_cart
  // Called either from cartOpened (static cart) or cartUpdate (after open).
  // ---------------------------------------------------------------------------
  function pushViewCart(cart) {
    cart = cart || {};
    var rawItems = cart.items || [];
    var mappedItems = [];

    for (var i = 0; i < rawItems.length; i++) {
      var ci = rawItems[i];
      var lookup = _storeItemMap[ci.id] || {};
      mappedItems.push({
        item_id:       String(ci.id || ''),
        item_name:     lookup.name || '',
        item_category: lookup.category_name || resolveCategory(ci),
        price:         (ci.price || lookup.price || 0) / 100,
        quantity:      ci.qty || 1
      });
    }

    // storeUpdate cart has subtotal: 0 — calculate from item prices if needed
    var cartValue = (cart.subtotal || 0) / 100;
    if (cartValue === 0 && mappedItems.length > 0) {
      for (var j = 0; j < mappedItems.length; j++) {
        cartValue += mappedItems[j].price * mappedItems[j].quantity;
      }
    }

    pushGA4('view_cart', {
      currency: _currency,
      value:    cartValue,
      items:    mappedItems
    });
  }

  // ---------------------------------------------------------------------------
  // view_cart — two code paths:
  // 1. cartUpdate arrives AFTER cartOpened (add-to-cart flow): _cartOpenPending
  //    flag is set here, cartUpdate fires view_cart when data is ready.
  // 2. User opens cart manually with no pending update: fire immediately from
  //    _lastCart which is already up to date.
  // ---------------------------------------------------------------------------
  window.addEventListener('paydia.cartOpened', function() {
    _cartOpenPending = true;

    // Fallback: if cartUpdate does not fire within 300ms (user opened a
    // static cart with no pending changes), fire from current _lastCart.
    setTimeout(function() {
      if (_cartOpenPending) {
        _cartOpenPending = false;
        pushViewCart(_lastCart);
      }
    }, 300);
  });

// ---------------------------------------------------------------------------
// begin_checkout → GA4 + Meta InitiateCheckout
//
// Triggered by click on #paydia-checkout-button.
// Uses event delegation on document so it works even if the button is
// injected into the DOM dynamically by the Paydia widget.
//
// DOM walking handles clicks on child elements inside the button
// (e.g. <span> text nodes) — checks e.target and its ancestors.
//
// Value and items come from _lastCart (cached on paydia.cartUpdate).
// If the cart hasn't fired yet, value will be 0 and items will be empty.
// ---------------------------------------------------------------------------
  document.addEventListener('click', function(e) {
    var target = e.target;
    while (target && target !== document) {
      if (target.id === 'paydia-checkout-button') {
        var cart = _lastCart || {};
        var rawItems = cart.items || [];
        var mappedItems = [];
        var contentIds = [];

        for (var i = 0; i < rawItems.length; i++) {
          var ci = rawItems[i];
          var lookup = _storeItemMap[ci.id] || {};
          var itemId = String(ci.id || '');
          mappedItems.push({
            item_id:       itemId,
            item_name:     lookup.name || '',
            item_category: lookup.category_name || resolveCategory(ci),
            price:         (ci.price || lookup.price || 0) / 100,
            quantity:      ci.qty || 1
          });
          contentIds.push(itemId);
        }

        var value = (cart.subtotal || 0) / 100;
        var currency = _currency;

        // GA4
        pushGA4('begin_checkout', {
          currency: currency,
          value:    value,
          items:    mappedItems
        });

        // Meta Pixel
        pushPixel('InitiateCheckout', {
          value:       value,
          currency:    currency,
          content_ids: contentIds,
          num_items:   rawItems.length
        });

        break;
      }
      target = target.parentNode;
    }
  });


  // ---------------------------------------------------------------------------
  // clear_cart → GA4 remove_from_cart (all items)
  //
  // Uses mousedown instead of click. Paydia's click handler clears _lastCart
  // before our click listener runs, so mousedown fires first and reads the
  // cart while it still has items.
  // ---------------------------------------------------------------------------
  document.addEventListener('mousedown', function(e) {
    var target = e.target;
    while (target && target !== document) {
      if (target.id === 'clear-cart-button') {
        var cart = _lastCart || {};
        var rawItems = cart.items || [];

        if (rawItems.length === 0) { break; }

        var mappedItems = [];
        var totalValue = 0;

        for (var i = 0; i < rawItems.length; i++) {
          var ci = rawItems[i];
          var lookup = _storeItemMap[ci.id] || {};
          var price = (ci.price || lookup.price || 0) / 100;
          var qty = ci.qty || 1;
          totalValue += price * qty;
          mappedItems.push({
            item_id:       String(ci.id || ''),
            item_name:     lookup.name || '',
            item_category: lookup.category_name || resolveCategory(ci),
            price:         price,
            quantity:      qty
          });
        }

        pushGA4('remove_from_cart', {
          currency: _currency,
          value:    totalValue,
          items:    mappedItems
        });

        break;
      }
      target = target.parentNode;
    }
  });

  // ---------------------------------------------------------------------------
  // purchase → GA4 + Meta Purchase
  //
  // Meta Pixel Purchase requires value + currency — both always populated here.
  // ---------------------------------------------------------------------------
  window.addEventListener('paydia.orderComplete', function(e) {
    var d = e.detail || {};
    var rawItems = d.items || [];
    var mappedItems = [];
    var contentIds = [];

    for (var i = 0; i < rawItems.length; i++) {
      mappedItems.push(mapItem(rawItems[i]));
      var posItem = rawItems[i].pos_item || {};
      contentIds.push(String(posItem.id || rawItems[i].id || ''));
    }

    var dedupedItems = deduplicateItems(mappedItems);
    var currency = d.currency_code || _currency;
    var value = (d.total_amount_paid || d.total || 0) / 100;

    // GA4
    pushGA4('purchase', {
      transaction_id: buildTransactionId(d),
      currency:       currency,
      value:          value,
      tax:            (d.taxes || 0) / 100,
      items:          dedupedItems
    });

    // Meta Pixel — value + currency are required fields for Purchase
    pushPixel('Purchase', {
      value:        value,
      currency:     currency,
      content_ids:  contentIds,
      content_type: 'product'
    });
  });

})();
</script>
