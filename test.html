<DOCTYPE html>
    <html>

    <head>
        <title>Test</title>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />        
        <style>
            body {
                color:#fff;
            }

            .nz-jobs-position-dropdown-container {
                background-color:#7a7a7a;
                padding: 25px;
                display: none;
            }

            button {
                background-color: red;
            }
        </style>
        
    </head>

    <body>


        <button class="nz-jobs-carousel-button" data-trigger="lifeguard">
            Click Lifeguard
        </button>
        <div class="nz-jobs-position-dropdown-container"> 
            <i class="fas fa-cloud close-icon"></i><br><br>
            Dropdown Lifeguard Container
        </div> 
        <button class="nz-jobs-carousel-button" data-trigger="admissions">
            Click Admissions
        </button>
        <div class="nz-jobs-position-dropdown-container"> 
            <i class="fas fa-cloud close-icon"></i><br><br>
            Dropdown Admissions Container
        </div>
      <script>
        const buttons = document.querySelectorAll('.nz-jobs-carousel-button');
        const dropdowns = document.querySelectorAll('.nz-jobs-position-dropdown-container');
        const closeIcons = document.querySelectorAll('.close-icon');

        //Opens the dropdown for each button
        buttons.forEach((button, index) => {
            button.addEventListener('click', () => {
                dropdowns[index].style.display = 'flex';

                //Closes all other dropdowns if a different one is clicked
                if(dropdowns[index].style.display === 'flex') {
                    dropdowns.forEach((dropdown, i) => {
                        if(i !== index) {
                            dropdown.style.display = 'none';
                        }
                    });
                }
            });
        });
        //Closes the dropdown via the close icon
        closeIcons.forEach((icon, index) => {
            icon.addEventListener('click', () => {
                dropdowns[index].style.display = 'none';
            });
        });

      </script>  
    </body>

    </html>
