<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Black Friday Countdown</title>

  <!-- External CSS -->
  <link rel="stylesheet" href="style.css" />

  <!-- Favicon (optional) -->
</head>
<body>

  <!-- Countdown Banner -->
  <div id="countdown-banner" class="countdown-banner">
    <button id="close-banner" class="close-banner">&times;</button>
    <p class="banner-text">Time until <span style="color:#ffdf4a"> Black Friday</span> Sale</p>
    <div id="countdown" class="countdown card">
      <div class="time-segment"><span id="hours">00</span><small>Hrs</small></div>
      <div class="colon">:</div>
      <div class="time-segment"><span id="minutes">00</span><small>Min</small></div>
      <div class="colon">:</div>
      <div class="time-segment"><span id="seconds">00</span><small>Sec</small></div>
    </div>
    <p></p>
  </div>


  <!-- Page Content -->
  <div class="content">
   
  </div>
    <!-- More content can go here -->

  <!-- External JavaScript -->
</body>
</html>
