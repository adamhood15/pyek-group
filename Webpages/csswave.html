<!DOCTYPE html>

<html lang="en">
  <head>
    <style>
     
      .hero-card_container {
        position: relative;
        bottom: -1px;
        left: -1px;
        right: -1px;
        margin-top: -26px;
        border-radius: 0 0 24px 24px;
        -webkit-transition: all 0.3s ease;
        transition: all 0.3s ease;
      }

      
      .hero-card_wave {
        padding: 32px 16px 16px;
        width: calc(100% + 2px);
        margin-left: -1px;
        margin-right: -1px;
        background-image: url(https://cdn.greatwolf.com/content/svg/mobile-wave.svg);
        background-repeat: repeat-x;
        background-position: 0 0;
        -webkit-transition: background-position 0.01s, max-height 0.4s ease-out;
        transition: background-position 0.01s, max-height 0.4s ease-out;
      }

    
      

      .hero-card_wave {
        padding: 34px 24px 16px;
        max-height: 88px;
        background-image: url(https://cdn.greatwolf.com/content/svg/wave-tile.svg);
      }

      @media (min-width: 1024px) {
        .wave {
          padding: 34px 24px 16px;
          max-height: 88px;
          background-image: url(https://cdn.greatwolf.com/content/svg/wave-tile.svg);
        }

        .hero-card_container {
          position: absolute;
          margin-top: unset;
        }

        .card-listing__bottom-box {
          gap: 16px;
          opacity: 0;
        }
      }

      body {
        background-color: red;
      }
    </style>
  </head>
  <body style="height: 200vh">
    <div class="hero-card_container">
      <div class="hero-card_wave">
        <span class="card-listing__title">Slap Tail Pond</span>
        <div class="card-listing__bottom-box">
          <div
            class="card-listing__bottom-box--box card-listing__box-ride-type"
          >
            <img
              class="lazyloaded"
              height="24"
              width="24"
              data-src="https://cdn.greatwolf.com/content/svg/waterpark_24x24.svg"
              alt="Ride Type Icon"
              src="https://cdn.greatwolf.com/content/svg/waterpark_24x24.svg"
            />
            <span class="card-listing__bottom-box--title">Indoor</span>
          </div>
          <div class="card-listing__bottom-box--box">
            <img
              height="14"
              width="24"
              class="lazyloaded"
              data-src="https://cdn.greatwolf.com/content/svg/thrill_level_low_24x24.svg"
              alt="Thrill Level Icon"
              src="https://cdn.greatwolf.com/content/svg/thrill_level_low_24x24.svg"
            />
            <span class="card-listing__bottom-box--title">Mild Thrill </span>
          </div>
        </div>
        <a
          class="hide-for-large"
          title="Learn More about Slap Tail Pond"
          href="/webster/waterpark-attractions/indoor-water-park/slap-tail-pond"
          target="_self"
        >
          <button>Learn More</button>
        </a>
      </div>
    </div>
  </body>
  <script>
    let waveX = 0, // current horizontal background position
      lastScrollY = scrollY, // last scroll position to detect direction
      waveVelocity = 0, // how fast the wave is moving
      driftInterval, // interval ID for the drift motion
      waveElement = document.querySelector(".hero-card_wave"); // the wave element

    addEventListener("scroll", () => {
      clearInterval(driftInterval);

      // Determine scroll direction and set velocity
      waveVelocity = scrollY > lastScrollY ? 4 : -4;

      // Update position immediately
      waveX += waveVelocity;
      waveElement.style.backgroundPosition = `${waveX}px 0`;

      // Store new scroll position
      lastScrollY = scrollY;

      // Continue drifting after scroll stops
      driftInterval = setInterval(() => {
        waveVelocity *= 0.98; // slow down smoothly
        waveX += waveVelocity;
        waveElement.style.backgroundPosition = `${waveX}px 0`;
        if (Math.abs(waveVelocity) < 0.3) clearInterval(driftInterval);
      }, 16);
    });
  </script>
</html>
