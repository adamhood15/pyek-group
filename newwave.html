<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Scrolling SVG Waves</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            height: 200vh; /* Enables scrolling */
        }

        .section {
            width: 100%;
            height: 300px;
            position: relative;
        }

        .image-section {
            background: url('your-image.jpg') center/cover no-repeat;
        }

        .blue-section {
            background: #007BFF;
        }

        .red-section {
            background: #FF0000;
        }

        .wave-container {
            position: absolute;
            width: 100%;
            bottom: 0;
        }

        svg {
            display: block;
            width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="section image-section">
        <div class="wave-container wave-image"></div>
    </div>

    <div class="section blue-section">
        <div class="wave-container wave-blue"></div>
    </div>

    <div class="section red-section"></div>

    <script>
        function createWave(containerClass, fillColor) {
            function renderWave() {
                const isDesktop = window.innerWidth > 768;
                const svgWidth = window.innerWidth;
                const svgHeight = isDesktop ? 180 : 120; // Taller waves on desktop
                const baseAmplitude = isDesktop ? 30 : 15; // More dramatic waves on desktop
                let scrollEffect = 0;
                let phaseShift = 0;
                let scrolling = false;

                document.querySelectorAll(containerClass).forEach(container => {
                    container.innerHTML = ''; // Clear old SVG on resize
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("width", "100%");
                    svg.setAttribute("height", svgHeight);
                    svg.setAttribute("viewBox", `0 0 ${svgWidth} ${svgHeight}`);

                    const fillPath = document.createElementNS("http://www.w3.org/2000/svg", "path");

                    svg.appendChild(fillPath);
                    container.appendChild(svg);

                    function updateWave() {
                        let amplitude = baseAmplitude + scrollEffect + Math.sin(Date.now() * 0.002) * baseAmplitude * 0.4;
                        let frequency = isDesktop ? 0.015 : 0.025; // Smoother waves on desktop

                        let wavePath = `M 0 ${svgHeight / 2}`;
                        for (let x = 0; x < svgWidth; x++) {
                            const y = amplitude * Math.sin(frequency * x + phaseShift) + svgHeight / 2;
                            wavePath += ` L ${x} ${y}`;
                        }

                        fillPath.setAttribute('d', wavePath + ` L ${svgWidth} ${svgHeight} L 0 ${svgHeight} Z`);
                        fillPath.setAttribute('fill', fillColor);
                    }

                    function animateWave() {
                        phaseShift -= 0.03; // Slower movement for a natural feel

                        if (scrolling) {
                            scrollEffect = Math.min(scrollEffect + 2, baseAmplitude * 1.5);
                        } else {
                            scrollEffect = Math.max(scrollEffect - 0.5, 0);
                        }

                        updateWave();
                        requestAnimationFrame(animateWave);
                    }

                    animateWave();

                    let timeout;
                    window.addEventListener('scroll', () => {
                        scrolling = true;
                        clearTimeout(timeout);
                        timeout = setTimeout(() => scrolling = false, 200);
                    });
                });
            }

            renderWave();
            window.addEventListener('resize', renderWave); // Adjust waves on screen resize
        }

        createWave('.wave-image', '#16cdd8'); // Blue wave
        createWave('.wave-blue', '#ffffff');  // Red wave
    </script>

</body>
</html>
